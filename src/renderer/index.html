<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Lab</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local workspace</p>
          <h1>Finance lab</h1>
        </div>
        <div class="topbar-meta">
          <span class="status-dot"></span>
          <span>local cache</span>
        </div>
      </header>

      <main class="workspace">
        <section class="pane pane-left" data-pane="left"></section>
        <div class="splitter splitter-x" data-splitter="left"></div>

        <section class="pane pane-center">
          <section class="pane pane-main" data-pane="main"></section>
          <div class="splitter splitter-y" data-splitter="bottom"></div>
          <section class="pane pane-bottom" data-pane="bottom"></section>
        </section>

        <div class="splitter splitter-x" data-splitter="right"></div>
        <section class="pane pane-right" data-pane="right"></section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
