name: Dev PR CI

on:
  pull_request:
    branches:
      - "dev-*"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: dev-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

jobs:
  desktop-quality:
    name: Desktop quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install desktop dependencies
        run: npm ci

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build native helper
        run: npm run build:native

      - name: Compile Python sources
        run: python -m compileall scripts tests

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate key desktop entry points exist
        run: |
          set -euo pipefail
          test -f src/main/main.js
          test -f src/preload/preload.js
          test -f src/renderer/index.html
          test -f src/renderer/map.html
          test -f native/bin/hello_logs

  desktop-package-linux:
    name: Desktop Linux package smoke build
    runs-on: ubuntu-latest
    needs: desktop-quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Build native helper
        run: npm run build:native

      - name: Build unpacked Electron app
        run: npx electron-builder --linux dir --publish never

      - name: Upload packaged desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-unpacked
          path: dist/linux-unpacked
          if-no-files-found: error

  landing-quality:
    name: Landing quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: landing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install landing dependencies
        run: npm ci

      - name: Lint landing sources
        run: npm run lint

      - name: Build landing site
        run: npm run build

      - name: Upload landing artifact
        uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing/dist
          if-no-files-found: error

  repo-sanity:
    name: Repository sanity checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate workflow target branch naming
        run: |
          set -euo pipefail
          if [[ "${{ github.base_ref || '' }}" != "" && ! "${{ github.base_ref }}" =~ ^dev- ]]; then
            echo "This workflow is intended for PRs targeting dev-* branches."
            exit 1
          fi

      - name: Validate core docs and security files
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/README.md
          test -f SECURITY.md
